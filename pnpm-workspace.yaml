packages:
  - "packages/*"
  - "packages/adapters/*"

allowBuilds:
  '@sentry-internal/node-cpu-profiler': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  fast-xml-parser: ">=4.5.4"
  fast-xml-builder: ">=1.1.7"
  protobufjs: ">=7.5.5 <8"
  glob: ">=11.1.0"
  jws: ">=4.0.1"
  tar: ">=7.5.7"
  axios: ">=1.16.0"
  undici@5: "6.27.0"
  undici@6: "6.27.0"
  undici@7: "7.28.0"
  ws@8: ">=8.21.0"
  form-data@2: ">=2.5.6"
  form-data@4: ">=4.0.6"
  "@types/request>form-data": "4.0.6"
  tmp: ">=0.2.6"
  "@grpc/grpc-js": ">=1.14.4"
  minimatch@3: "3.1.5"
  minimatch@9: "9.0.7"
  minimatch@10: "10.2.5"
  flatted: ">=3.4.2"
  picomatch: ">=4.0.4"
  path-to-regexp: ">=8.4.0"
  lodash: ">=4.18.0"
  "@isaacs/brace-expansion": ">=5.0.1"
  eslint-plugin-react-hooks>zod: "^4.0.0"
