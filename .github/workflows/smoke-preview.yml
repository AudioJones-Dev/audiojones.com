name: Smoke Test (Preview)

on:
  pull_request:
    branches: [ main ]

# Vercel project identifiers are public — they appear in deploy URLs and
# in `.vercel/project.json`. Inlining here mirrors deploy.yml so the
# Vercel CLI can target the same project without extra secrets.
env:
  VERCEL_ORG_ID: team_BHxIkAGPW6qEKKQBAt9c0NGz
  VERCEL_PROJECT_ID: prj_o5mnBAlWyR5Cgi2A3gc9ertoGyJX

jobs:
  smoke_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository secrets — and therefore VERCEL_TOKEN — are not exposed
    # to PRs from forks or Dependabot, so this job would fail at the
    # deploy step with no useful signal. Skip it cleanly in those cases.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm packages:build

      - name: Deploy Vercel preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          # Vercel's GitHub integration does not auto-register Preview
          # deployments for PR commits in this project — every recent
          # deployment in the Vercel API is target=production from main.
          # Polling /repos/.../deployments?sha=... therefore always
          # times out. Deploy the preview ourselves with the same
          # VERCEL_TOKEN deploy.yml uses for production, and feed the
          # resulting URL into the smoke checks below.
          #
          # `vercel deploy` (no --prod) prints the deployment URL on
          # stdout and progress on stderr in non-TTY contexts, so we can
          # capture stdout directly.
          DEPLOY_URL="$(npx vercel@latest deploy \
            --token="${VERCEL_TOKEN}" \
            --cwd . \
            --yes)"

          if [ -z "${DEPLOY_URL}" ]; then
            echo "vercel deploy did not return a URL"
            exit 1
          fi

          echo "Deployed preview: ${DEPLOY_URL}"
          echo "preview_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke check preview routes
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          URLS=(
            "${PREVIEW_URL}/"
            "${PREVIEW_URL}/status"
            "${PREVIEW_URL}/portal/billing"
            "${PREVIEW_URL}/api/public/incidents"
          )

          # Build curl args. The bypass header is only appended when the secret
          # is configured — keeps the value out of the command line otherwise
          # and lets unprotected previews work without the secret.
          # Headers are written to a tmp file so we can surface Vercel's
          # `x-deny-reason` / `x-robots-tag` / etc. when a check fails,
          # rather than collapsing everything to an opaque status code.
          curl_args=(-s -o /dev/null -w "%{http_code}" -L)
          if [ -n "${VERCEL_PROTECTION_BYPASS:-}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS}")
          fi

          failed=0
          for url in "${URLS[@]}"; do
            headers_file="$(mktemp)"
            code="$(curl "${curl_args[@]}" -D "$headers_file" "$url")"
            echo "${url} -> ${code}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              deny_reason="$(awk -F': ' 'tolower($1) == "x-deny-reason" { print $2 }' "$headers_file" | tr -d '\r' | head -n 1)"

              if [ "$code" = "401" ] && [ -z "${VERCEL_PROTECTION_BYPASS:-}" ]; then
                echo "FAILED: ${url} returned 401."
                echo "Preview is protected and VERCEL_PROTECTION_BYPASS is not configured."
                echo "Add the 'VERCEL_PROTECTION_BYPASS' GitHub Actions secret with a Vercel Deployment Protection bypass token."
              elif [ "$code" = "403" ] && [ "$deny_reason" = "host_not_allowed" ]; then
                echo "FAILED: ${url} returned 403 with x-deny-reason=host_not_allowed."
                echo "The Vercel project's Firewall is blocking generated *.vercel.app preview hostnames."
                echo "Add the deployment URL pattern to the allowed-hosts rule in the Vercel dashboard,"
                echo "or remove the rule if production-only host enforcement is intentional."
              else
                echo "FAILED: ${url} returned ${code}${deny_reason:+ (x-deny-reason=${deny_reason})}"
              fi

              echo "---- response headers for ${url} ----"
              cat "$headers_file"
              echo "--------------------------------------"
              failed=1
            fi
            rm -f "$headers_file"
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
