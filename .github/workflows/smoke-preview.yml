name: Smoke Test (Preview)

on:
  pull_request:
    branches: [ main ]

jobs:
  smoke_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve preview deployment URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          DEPLOYMENTS_URL="https://api.github.com/repos/${REPO}/deployments?sha=${SHA}&per_page=20"
          DEPLOYMENT_ID="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$DEPLOYMENTS_URL" | jq -r '[.[] | select(.environment == "Preview")] | first | .id // empty')"

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "No Preview deployment found for commit ${SHA}"
            exit 1
          fi

          STATUS_URL="https://api.github.com/repos/${REPO}/deployments/${DEPLOYMENT_ID}/statuses?per_page=20"
          PREVIEW_URL="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$STATUS_URL" | jq -r '[.[] | select(.state == "success" and .environment_url != null)] | first | .environment_url // empty')"

          if [ -z "$PREVIEW_URL" ]; then
            echo "No successful deployment status with environment_url found for deployment ${DEPLOYMENT_ID}"
            exit 1
          fi

          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "Resolved preview URL: ${PREVIEW_URL}"

      - name: Smoke check preview routes
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          URLS=(
            "${PREVIEW_URL}/"
            "${PREVIEW_URL}/status"
            "${PREVIEW_URL}/portal/billing"
            "${PREVIEW_URL}/api/public/incidents"
          )

          # Build curl args. The bypass header is only appended when the secret
          # is configured — keeps the value out of the command line otherwise
          # and lets unprotected previews work without the secret.
          curl_args=(-s -o /dev/null -w "%{http_code}" -L)
          if [ -n "${VERCEL_PROTECTION_BYPASS:-}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS}")
          fi

          failed=0
          for url in "${URLS[@]}"; do
            code="$(curl "${curl_args[@]}" "$url")"
            echo "${url} -> ${code}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              if [ "$code" = "401" ] && [ -z "${VERCEL_PROTECTION_BYPASS:-}" ]; then
                echo "FAILED: ${url} returned 401."
                echo "Preview is protected and VERCEL_PROTECTION_BYPASS is not configured."
                echo "Add the 'VERCEL_PROTECTION_BYPASS' GitHub Actions secret with a Vercel Deployment Protection bypass token."
              else
                echo "FAILED: ${url} returned ${code}"
              fi
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
