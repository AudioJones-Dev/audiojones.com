name: Smoke Test (Preview)

on:
  pull_request:
    branches: [ main ]

jobs:
  smoke_preview:
    runs-on: ubuntu-latest
    # actions: read is required to list and download the preview-url artifact
    # published by the deploy_preview job in the Deploy workflow.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # The preview URL is published as an artifact by the deploy_preview
          # job in deploy.yml. This previously polled the GitHub Deployments
          # API instead, but that job deploys with the Vercel CLI, which never
          # registers a Deployment record — so the lookup never matched, this
          # job took its skip path on every run, and exited 0. The check
          # reported green without ever executing a single assertion.
          #
          # Outcome semantics:
          #   - artifact found  -> run smoke checks
          #   - not found in window -> FAIL. The artifact is produced by our own
          #     workflow whenever the preview deploys, so its absence means the
          #     preview did not deploy. That is a real signal, not an
          #     infrastructure quirk to be waved through.
          MAX_ATTEMPTS=30
          SLEEP_SECS=10
          ARTIFACT_NAME="preview-url-${SHA}"
          ARTIFACTS_URL="https://api.github.com/repos/${REPO}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1"

          echo "PR head SHA:    ${SHA}"
          echo "PR head branch: ${BRANCH}"
          echo "Artifact:       ${ARTIFACT_NAME}"
          echo "Max wait:       $((MAX_ATTEMPTS * SLEEP_SECS))s"

          PREVIEW_URL=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            ARTIFACT_ID="$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$ARTIFACTS_URL" | jq -r '.artifacts // [] | map(select(.expired == false)) | first | .id // empty')"

            if [ -n "$ARTIFACT_ID" ]; then
              curl -sSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -o preview-url.zip \
                "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip"
              unzip -o -q preview-url.zip -d preview-url
              PREVIEW_URL="$(tr -d '\r\n' < preview-url/preview-url.txt)"
              if [ -n "$PREVIEW_URL" ]; then
                echo "[attempt ${attempt}/${MAX_ATTEMPTS}] Resolved preview URL: ${PREVIEW_URL}"
                break
              fi
              echo "[attempt ${attempt}/${MAX_ATTEMPTS}] Artifact present but empty; sleeping ${SLEEP_SECS}s"
            else
              echo "[attempt ${attempt}/${MAX_ATTEMPTS}] Preview URL artifact not published yet; sleeping ${SLEEP_SECS}s"
            fi
            sleep "$SLEEP_SECS"
          done

          if [ -z "$PREVIEW_URL" ]; then
            echo "No preview URL was published for ${SHA} within the wait window."
            echo "The deploy_preview job in 'Deploy AJ Digital Suite' publishes this artifact"
            echo "whenever a preview deploys, so this means the preview did not deploy."
            echo "Check that job for the failure; smoke assertions did not run."
            {
              echo "outcome=failed"
              echo "deployment_found=false"
              echo "attempts_used=${MAX_ATTEMPTS}"
              echo "last_state=no-preview-url-artifact"
              echo "preview_url="
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          {
            echo "outcome=ready"
            echo "deployment_found=true"
            echo "attempts_used=0"
            echo "preview_url=${PREVIEW_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke check preview routes
        if: steps.preview.outputs.outcome == 'ready'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          URLS=(
            "${PREVIEW_URL}/"
            "${PREVIEW_URL}/status"
            "${PREVIEW_URL}/portal/billing"
            "${PREVIEW_URL}/api/public/incidents"
          )

          # Build curl args. The bypass header is only appended when the secret
          # is configured — keeps the value out of the command line otherwise
          # and lets unprotected previews work without the secret.
          curl_args=(-s -o /dev/null -w "%{http_code}" -L)
          if [ -n "${VERCEL_PROTECTION_BYPASS:-}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS}")
          fi

          failed=0
          for url in "${URLS[@]}"; do
            code="$(curl "${curl_args[@]}" "$url")"
            echo "${url} -> ${code}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              if [ "$code" = "401" ] && [ -z "${VERCEL_PROTECTION_BYPASS:-}" ]; then
                echo "FAILED: ${url} returned 401."
                echo "Preview is protected and VERCEL_PROTECTION_BYPASS is not configured."
                echo "Add the 'VERCEL_PROTECTION_BYPASS' GitHub Actions secret with a Vercel Deployment Protection bypass token."
              else
                echo "FAILED: ${url} returned ${code}"
              fi
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      # Additive output for PR Validation Summary workflow. Backwards-
      # compatible: failures here do not affect this job's outcome.
      - name: Write smoke-preview summary artifact
        if: always()
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.preview.outputs.outcome }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          DEPLOYMENT_FOUND: ${{ steps.preview.outputs.deployment_found }}
          ATTEMPTS_USED: ${{ steps.preview.outputs.attempts_used }}
          LAST_STATE: ${{ steps.preview.outputs.last_state }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p out
          cat > out/smoke-preview.json <<EOF
          {
            "schema_version": "1",
            "head_sha": "${HEAD_SHA}",
            "outcome": "${OUTCOME:-unknown}",
            "preview_url": "${PREVIEW_URL:-}",
            "deployment_found": "${DEPLOYMENT_FOUND:-false}",
            "attempts_used": "${ATTEMPTS_USED:-0}",
            "last_state": "${LAST_STATE:-unknown}"
          }
          EOF

      - name: Upload smoke-preview summary artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-preview-${{ github.event.pull_request.head.sha }}
          path: out/smoke-preview.json
          retention-days: 14
