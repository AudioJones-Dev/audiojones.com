name: Smoke Test (Preview)

on:
  pull_request:
    branches: [ main ]

jobs:
  smoke_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Vercel registers the Preview deployment on GitHub *after* the
          # PR workflow starts. A one-shot lookup therefore races the
          # deployment and fails immediately even when Vercel later
          # publishes a healthy preview, producing recurring false
          # negatives on this check. Poll the Deployments API until the
          # Preview deployment exists AND has a status row with
          # state=success + environment_url. Bounded: 30 attempts every
          # 10 seconds = 5 minutes maximum wait.
          #
          # Outcome semantics:
          #   - found + success  -> run smoke checks
          #   - found + terminal failure (failure/error) -> fail this job
          #   - not found after wait window -> skip smoke checks (exit 0)
          # The "not found" path treats absence of a Vercel preview as an
          # infrastructure condition (e.g. Vercel GitHub integration not
          # configured for this branch), not a PR defect. Code validation
          # gates run independently in other workflows.
          MAX_ATTEMPTS=30
          SLEEP_SECS=10
          DEPLOYMENTS_URL="https://api.github.com/repos/${REPO}/deployments?sha=${SHA}&per_page=20"

          echo "PR head SHA:    ${SHA}"
          echo "PR head branch: ${BRANCH}"
          echo "Max wait:       $((MAX_ATTEMPTS * SLEEP_SECS))s (${MAX_ATTEMPTS} attempts x ${SLEEP_SECS}s)"

          PREVIEW_URL=""
          LAST_STATE=""
          ATTEMPTS_USED=0
          DEPLOYMENT_FOUND="false"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            ATTEMPTS_USED="$attempt"
            DEPLOYMENT_ID="$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$DEPLOYMENTS_URL" | jq -r '[.[] | select(.environment == "Preview")] | first | .id // empty')"

            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "[attempt ${attempt}/${MAX_ATTEMPTS}] No Preview deployment registered yet for ${SHA}; sleeping ${SLEEP_SECS}s"
              sleep "$SLEEP_SECS"
              continue
            fi

            DEPLOYMENT_FOUND="true"
            STATUS_URL="https://api.github.com/repos/${REPO}/deployments/${DEPLOYMENT_ID}/statuses?per_page=20"
            STATUS_JSON="$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$STATUS_URL")"

            PREVIEW_URL="$(echo "$STATUS_JSON" | jq -r '[.[] | select(.state == "success" and .environment_url != null)] | first | .environment_url // empty')"
            if [ -n "$PREVIEW_URL" ]; then
              echo "[attempt ${attempt}/${MAX_ATTEMPTS}] Resolved preview URL: ${PREVIEW_URL}"
              break
            fi

            # Fail fast on terminal Vercel failure states — additional
            # polling will not recover a deployment that Vercel itself
            # marked as failed or errored.
            TERMINAL_FAILURE="$(echo "$STATUS_JSON" | jq -r '[.[] | select(.state == "failure" or .state == "error")] | first | .state // empty')"
            if [ -n "$TERMINAL_FAILURE" ]; then
              echo "Preview deployment ${DEPLOYMENT_ID} reported terminal state: ${TERMINAL_FAILURE}"
              echo "Status history:"
              echo "$STATUS_JSON" | jq -r '.[] | "  - \(.created_at) state=\(.state) env_url=\(.environment_url)"'
              {
                echo "outcome=failed"
                echo "deployment_found=true"
                echo "attempts_used=${attempt}"
                echo "preview_url="
              } >> "$GITHUB_OUTPUT"
              exit 1
            fi

            LAST_STATE="$(echo "$STATUS_JSON" | jq -r '[.[]] | first | .state // "no-statuses"')"
            echo "[attempt ${attempt}/${MAX_ATTEMPTS}] Deployment ${DEPLOYMENT_ID} state=${LAST_STATE}; sleeping ${SLEEP_SECS}s"
            sleep "$SLEEP_SECS"
          done

          if [ -z "$PREVIEW_URL" ]; then
            if [ "$DEPLOYMENT_FOUND" = "true" ]; then
              # Deployment record exists but never reached success within
              # the wait window. Treat as skip rather than failure —
              # Vercel may still publish the preview later, and code
              # validation already passed in other workflows.
              echo "No Vercel preview deployment was found in a success state for this head SHA. Skipping smoke_preview. Code validation already passed."
              echo "Deployment was registered but last observed state was: ${LAST_STATE:-unknown}"
            else
              echo "No Vercel preview deployment was found for this head SHA. Skipping smoke_preview. Code validation already passed."
              echo "This usually means the Vercel GitHub integration did not produce a preview for branch '${BRANCH}' (for example, the branch pattern is excluded in Vercel project settings or git.deploymentEnabled in vercel.json)."
            fi
            {
              echo "outcome=skipped"
              echo "deployment_found=${DEPLOYMENT_FOUND}"
              echo "attempts_used=${ATTEMPTS_USED}"
              echo "preview_url="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "outcome=ready"
            echo "deployment_found=true"
            echo "attempts_used=${ATTEMPTS_USED}"
            echo "preview_url=${PREVIEW_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke check preview routes
        if: steps.preview.outputs.outcome == 'ready'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          URLS=(
            "${PREVIEW_URL}/"
            "${PREVIEW_URL}/status"
            "${PREVIEW_URL}/portal/billing"
            "${PREVIEW_URL}/api/public/incidents"
          )

          # Build curl args. The bypass header is only appended when the secret
          # is configured — keeps the value out of the command line otherwise
          # and lets unprotected previews work without the secret.
          curl_args=(-s -o /dev/null -w "%{http_code}" -L)
          if [ -n "${VERCEL_PROTECTION_BYPASS:-}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS}")
          fi

          failed=0
          for url in "${URLS[@]}"; do
            code="$(curl "${curl_args[@]}" "$url")"
            echo "${url} -> ${code}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              if [ "$code" = "401" ] && [ -z "${VERCEL_PROTECTION_BYPASS:-}" ]; then
                echo "FAILED: ${url} returned 401."
                echo "Preview is protected and VERCEL_PROTECTION_BYPASS is not configured."
                echo "Add the 'VERCEL_PROTECTION_BYPASS' GitHub Actions secret with a Vercel Deployment Protection bypass token."
              else
                echo "FAILED: ${url} returned ${code}"
              fi
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Report skip
        if: steps.preview.outputs.outcome == 'skipped'
        run: |
          echo "::notice title=smoke_preview skipped::No Vercel preview deployment was found for this head SHA. Code validation already passed."
          echo "attempts_used=${{ steps.preview.outputs.attempts_used }}"
          echo "deployment_found=${{ steps.preview.outputs.deployment_found }}"
