name: PR Validation Summary

on:
  workflow_run:
    workflows:
      - CI
      - Build & Lint
      - Smoke Test (Preview)
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read

jobs:
  summarize:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              core.setOutput('pr_number', '');
              core.setOutput('head_sha', run.head_sha);
              return;
            }
            core.setOutput('pr_number', String(prs[0].number));
            core.setOutput('head_sha', run.head_sha);

      - name: Skip when no PR is associated
        if: steps.pr.outputs.pr_number == ''
        run: echo "No PR for run ${{ github.event.workflow_run.id }}; nothing to summarise."

      - name: Circuit breaker check
        id: breaker
        if: steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                ...context.repo,
                workflow_id: context.workflow,
                per_page: 100,
                created: `>=${since}`,
              },
            );
            const sameRun = runs.filter((r) =>
              (r.pull_requests || []).some((p) => p.number === prNumber),
            );
            core.setOutput('count', String(sameRun.length));
            core.setOutput('tripped', sameRun.length > 10 ? 'true' : 'false');

      - name: Post circuit-breaker notice
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BREAKER_COUNT: ${{ steps.breaker.outputs.count }}
        with:
          script: |
            const marker = '<!-- aj:validation-summary -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const body = `${marker}\n### Validation summary — circuit breaker tripped\n\nMore than 10 summary runs detected in the last 24h for this PR (count: ${process.env.BREAKER_COUNT}). Further updates are paused until the PR is force-pushed. See \`docs/ops/AUTOMATED_VALIDATION_REVIEW_LOOP.md\` §9.11.\n`;
            const existing = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const mine = existing.find((c) => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: prNumber, body,
              });
            }

      - name: Checkout renderer
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          sparse-checkout: |
            scripts/render-validation-summary.ts
          sparse-checkout-cone-mode: false

      - name: Download smoke-preview artifact (if any)
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped != 'true'
        id: smoke_artifact
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const headSha = process.env.HEAD_SHA;
            const artifactName = `smoke-preview-${headSha}`;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...context.repo, per_page: 100, name: artifactName },
            );
            if (!artifacts.length) {
              core.setOutput('found', 'false');
              return;
            }
            const artifact = artifacts[0];
            const dl = await github.rest.actions.downloadArtifact({
              ...context.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            const out = path.join(process.cwd(), 'smoke-preview.zip');
            fs.writeFileSync(out, Buffer.from(dl.data));
            core.setOutput('found', 'true');
            core.setOutput('zip_path', out);

      - name: Extract smoke-preview artifact
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped != 'true' && steps.smoke_artifact.outputs.found == 'true'
        run: |
          mkdir -p smoke-preview
          unzip -o "${{ steps.smoke_artifact.outputs.zip_path }}" -d smoke-preview

      - name: Build validation summary
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped != 'true'
        id: summary
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SMOKE_FOUND: ${{ steps.smoke_artifact.outputs.found }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const watched = new Set(['CI', 'Build & Lint', 'Smoke Test (Preview)']);

            // `watched` holds WORKFLOW names, so read workflow runs. Check runs
            // carry the JOB name (`validate`, `verify`, `build`, `Preflight`, …),
            // which never matches — that mismatch left `steps` empty and made
            // every PR report a failure.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...context.repo, head_sha: headSha, per_page: 100 },
            );

            const byWorkflow = {};
            for (const r of runs) {
              if (!watched.has(r.name)) continue;
              const existing = byWorkflow[r.name];
              if (!existing || new Date(r.updated_at || 0) > new Date(existing.updated_at || 0)) {
                byWorkflow[r.name] = r;
              }
            }

            const steps = Object.values(byWorkflow).map((r) => ({
              name: r.name,
              status: r.status,
              conclusion: r.conclusion,
              url: r.html_url,
            }));

            const isFailure = (c) =>
              c && c.conclusion && !['success', 'skipped', 'neutral'].includes(c.conclusion);
            const failed = steps.filter((s) => isFailure(s));
            const skipped = steps.filter((s) => s.conclusion === 'skipped' || s.conclusion === 'neutral');
            // A run still in flight has no conclusion yet, and an empty set means
            // nothing has reported. Neither is a failure — treating them as one is
            // what produced the false red.
            const pending = steps.filter((s) => s.status !== 'completed');
            const allGreen = failed.length === 0 && pending.length === 0 && steps.length > 0;
            const isPending = failed.length === 0 && (pending.length > 0 || steps.length === 0);

            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: prNumber, per_page: 100,
            });

            const touchesFunnel = files.some((f) =>
              /src\/app\/api\/applied-intelligence\/leads\//.test(f.filename) ||
              /src\/db\/leads\.ts/.test(f.filename) ||
              /src\/app\/api\/webhooks\//.test(f.filename),
            );
            const touchesDeps = files.some((f) => /^(package\.json|pnpm-lock\.yaml)$/.test(f.filename));
            const touchesRoutes = files.some((f) => /^src\/app\/.*\/(page|route)\.tsx?$/.test(f.filename));

            let preview = { url: null, outcome: null };
            if (process.env.SMOKE_FOUND === 'true') {
              try {
                const raw = fs.readFileSync('smoke-preview/smoke-preview.json', 'utf8');
                const data = JSON.parse(raw);
                preview = {
                  url: data.preview_url || data.url || null,
                  outcome: data.outcome || null,
                };
              } catch (err) {
                core.warning(`Could not parse smoke-preview artifact: ${err.message}`);
              }
            }

            let nextAction = 'none';
            let nextActionReason = 'All checks green; ready for review or merge.';

            if (isPending) {
              nextAction = 'none';
              nextActionReason = steps.length === 0
                ? 'No watched workflow run has reported for this commit yet; nothing to classify.'
                : `Still running: ${pending.map((p) => p.name).join(', ')}.`;
            } else if (!allGreen) {
              const failedNames = failed.map((f) => f.name);
              const codeGateFailed = failedNames.some((n) => /^(CI|Build & Lint)$/.test(n));
              const smokeFailed = failedNames.some((n) => /Smoke Test/.test(n));
              if (codeGateFailed) {
                nextAction = 'codex-fix';
                nextActionReason = `Code gate failed: ${failedNames.join(', ')}. Codex should reproduce and fix locally before re-pushing.`;
              } else if (smokeFailed && touchesFunnel) {
                nextAction = 'human-approval';
                nextActionReason = 'Smoke regression on a PR that touches lead/funnel code. AGENTS.md §5.4 requires human audit.';
              } else if (smokeFailed) {
                nextAction = 'claude-review';
                nextActionReason = 'Preview smoke failed but code gates passed. Claude should classify env-vs-code per AGENTS.md §5.5.';
              } else {
                nextAction = 'claude-review';
                nextActionReason = 'Non-code check failed; needs classification.';
              }
            } else if (touchesDeps) {
              nextAction = 'human-approval';
              nextActionReason = 'Dependency or lockfile change — AGENTS.md §2.5/§2.6 require human approval.';
            } else if (touchesRoutes) {
              nextAction = 'claude-review';
              nextActionReason = 'Route file touched. Verify no rename without redirect plan per AGENTS.md §2.4.';
            }

            const payload = {
              schema_version: '1',
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pr_number: prNumber,
              pr_url: pr.data.html_url,
              head_sha: headSha,
              head_ref: pr.data.head.ref,
              base_ref: pr.data.base.ref,
              triggering_workflow: context.payload.workflow_run.name,
              triggering_run_id: context.payload.workflow_run.id,
              generated_at: new Date().toISOString(),
              overall_status: allGreen ? 'pass' : isPending ? 'pending' : 'fail',
              steps,
              failed_steps: failed,
              skipped_steps: skipped,
              changed_files: files.slice(0, 50).map((f) => ({
                path: f.filename,
                status: f.status,
                additions: f.additions,
                deletions: f.deletions,
              })),
              changed_files_truncated: files.length > 50,
              changed_files_total: files.length,
              preview,
              next_action: nextAction,
              next_action_reason: nextActionReason,
            };

            fs.mkdirSync('out', { recursive: true });
            fs.writeFileSync('out/validation-summary.json', JSON.stringify(payload, null, 2));
            core.setOutput('payload_path', 'out/validation-summary.json');
            core.setOutput('next_action', nextAction);
            core.setOutput('overall_status', payload.overall_status);

      - name: Render Markdown comment body
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped != 'true'
        run: |
          npx --yes tsx scripts/render-validation-summary.ts \
            out/validation-summary.json > out/validation-summary.md

      - name: Upload validation summary artifact
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary-${{ steps.pr.outputs.head_sha }}
          path: out/validation-summary.*
          retention-days: 14

      - name: Upsert sticky PR comment
        if: steps.pr.outputs.pr_number != '' && steps.breaker.outputs.tripped != 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/validation-summary.md', 'utf8');
            const marker = '<!-- aj:validation-summary -->';
            const fullBody = `${marker}\n${body}`;
            const prNumber = Number(process.env.PR_NUMBER);
            const existing = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const mine = existing.find((c) => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: mine.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: prNumber, body: fullBody,
              });
            }

      # Phase 2 (n8n / Slack webhook) is intentionally not enabled here.
      # See docs/ops/AUTOMATED_VALIDATION_REVIEW_LOOP.md §4 for the plan.
