name: Deploy AJ Digital Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Vercel project identifiers are public — they appear in deploy URLs and
# in `.vercel/project.json`. Inlining them here avoids carrying redundant
# GitHub secrets and makes the deploy target legible at-a-glance.
env:
  VERCEL_ORG_ID: team_BHxIkAGPW6qEKKQBAt9c0NGz
  VERCEL_PROJECT_ID: prj_o5mnBAlWyR5Cgi2A3gc9ertoGyJX

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Lint
        run: pnpm lint

  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Build application
        run: pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Serialize production deploys so a slower/older run cannot finish after a
    # newer one and publish stale code over it.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so we can compare the checked-out SHA against the
          # current tip of origin/main in the deploy guard below.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Guard against publishing stale code: only deploy when this checkout
        # is the current tip of origin/main. Re-running an older workflow run
        # (which checks out an older SHA) is skipped instead of rolling
        # production back — the failure mode that previously pinned production
        # to old commits.
        run: |
          git fetch origin main --quiet
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$head_sha" != "$main_sha" ]; then
            echo "::warning::Refusing to deploy: HEAD ${head_sha} is not the tip of origin/main (${main_sha}). Skipping to avoid publishing stale code to production."
            exit 0
          fi
          npx vercel@latest deploy --prod --token="${VERCEL_TOKEN}" --cwd .

  # Branch previews — the Vercel Git integration only auto-deploys `main`
  # to production, so pull requests never got a preview URL. This job
  # deploys each PR to a Vercel preview target and surfaces the URL as a
  # sticky PR comment so changes can be reviewed before merge.
  deploy_preview:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Deploy preview to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx vercel@latest deploy --token="${VERCEL_TOKEN}" --cwd . --yes)"
          echo "preview_url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel preview"
            echo ""
            echo "${url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel.outputs.preview_url }}';
            const marker = '<!-- vercel-preview-url -->';
            const headSha = context.payload.pull_request.head.sha;
            const body = `${marker}\n🔍 **Preview deployment ready**\n\n${url}\n\n_Updated for commit \`${headSha.slice(0, 7)}\`._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
