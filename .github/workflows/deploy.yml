name: Deploy AJ Digital Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Vercel project identifiers are public — they appear in deploy URLs and
# in `.vercel/project.json`. Inlining them here avoids carrying redundant
# GitHub secrets and makes the deploy target legible at-a-glance.
env:
  VERCEL_ORG_ID: team_BHxIkAGPW6qEKKQBAt9c0NGz
  VERCEL_PROJECT_ID: prj_o5mnBAlWyR5Cgi2A3gc9ertoGyJX
  # Corepack activates the pnpm version pinned in package.json on first use;
  # without this it can block on a download confirmation prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # `restore-keys` is why this is a hand-rolled cache rather than
      # setup-node's `cache: 'pnpm'`: a lockfile change still restores the
      # previous store and fetches only the delta.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Lint
        run: pnpm lint

  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Build application
        run: pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prod --token="${VERCEL_TOKEN}" --cwd .

  # Branch previews — the Vercel Git integration only auto-deploys `main`
  # to production, so pull requests never got a preview URL. This job
  # deploys each PR to a Vercel preview target and surfaces the URL as a
  # sticky PR comment so changes can be reviewed before merge.
  deploy_preview:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm packages:build

      - name: Deploy preview to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # --force discards the restored build cache and installs clean.
          # Without it Vercel restores node_modules from a previous
          # deployment and runs an incremental install over it, so a PR that
          # changes a resolved dependency version can be built against a
          # tree that never matches its lockfile. See docs/DECISIONS.md.
          url="$(npx vercel@latest deploy --force --token="${VERCEL_TOKEN}" --cwd . --yes)"
          echo "preview_url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel preview"
            echo ""
            echo "${url}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publishes the preview URL for the Smoke Test (Preview) workflow.
      # That workflow previously resolved the URL from the GitHub Deployments
      # API, but this job deploys via the Vercel CLI, which never registers a
      # Deployment record — so the lookup never matched and smoke silently
      # skipped on every PR. An artifact is a deliberate cross-workflow
      # channel; absence of it now means the preview genuinely did not deploy.
      - name: Publish preview URL for smoke tests
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
        run: |
          mkdir -p out
          printf '%s\n' "${PREVIEW_URL}" > out/preview-url.txt

      - name: Upload preview URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-url-${{ github.event.pull_request.head.sha }}
          path: out/preview-url.txt
          retention-days: 7

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel.outputs.preview_url }}';
            const marker = '<!-- vercel-preview-url -->';
            const headSha = context.payload.pull_request.head.sha;
            const body = `${marker}\n🔍 **Preview deployment ready**\n\n${url}\n\n_Updated for commit \`${headSha.slice(0, 7)}\`._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
