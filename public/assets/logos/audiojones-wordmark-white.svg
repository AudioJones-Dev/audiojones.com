<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" fill="none" role="img" aria-label="Audio Jones">
  <title>Audio Jones — Horizontal Wordmark (white on dark)</title>
  <!-- Signal mark -->
  <g fill="#E8FF5A">
    <rect x="22"  y="60"  width="14" height="58"  rx="7" />
    <rect x="50"  y="40"  width="14" height="78"  rx="7" />
    <rect x="78"  y="22"  width="14" height="96"  rx="7" />
    <circle cx="57" cy="138" r="14" />
  </g>
  <!-- Divider -->
  <line x1="120" y1="32" x2="120" y2="128" stroke="#E8E8E8" stroke-opacity="0.35" stroke-width="1.5" />
  <!-- Wordmark text (Syne) -->
  <text
    x="148"
    y="100"
    font-family="Syne, 'Space Grotesk', ui-sans-serif, system-ui, sans-serif"
    font-weight="800"
    font-size="72"
    letter-spacing="-1.4"
    fill="#FFFFFF"
  >Audio Jones</text>
  <!-- Tagline (DM Mono) -->
  <text
    x="150"
    y="132"
    font-family="'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
    font-weight="500"
    font-size="13"
    letter-spacing="3.4"
    fill="#E8FF5A"
  >APPLIED INTELLIGENCE SYSTEMS</text>
</svg>
